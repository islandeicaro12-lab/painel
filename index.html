:root{--r:16px;--sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);--shh:0 2px 4px rgba(16,24,40,.05),0 16px 34px -14px rgba(16,24,40,.22);--g1:color-mix(in srgb,var(--pri) 100%,#000 0%);--g2:color-mix(in srgb,var(--pri) 78%,#3b82f6)}

:root[data-theme="dark"]{--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -14px rgba(0,0,0,.7);--shh:0 1px 0 rgba(255,255,255,.04) inset,0 18px 38px -14px rgba(0,0,0,.85)}
body{background:radial-gradient(900px 480px at 8% -6%,color-mix(in srgb,var(--pri) 11%,transparent),transparent 62%),radial-gradient(760px 420px at 100% 0%,color-mix(in srgb,#6366f1 8%,transparent),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}

*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mut) 40%,transparent) transparent}

['Entrar no painel e recuperar a senha',`<ol><li>Abra <b>painelcobranca.online</b> no navegador do celular ou do computador.</li><li>Digite o <b>Usuário</b> e a <b>Senha</b> e toque em <b>Entrar</b>. Toque em <b>Mostrar</b> para ver a senha.</li></ol><p><b>Esqueci a senha:</b> na tela de login, toque em <b>Esqueci minha senha</b>, digite o e-mail que é o seu usuário e siga o link recebido (veja também o spam). Se o seu usuário não for um e-mail, peça ao administrador para trocar a senha.</p><ul><li><b>Menu:</b> no computador fica na lateral. No celular fica na barra de baixo, com o nome de cada aba. Deslize a barra para o lado para ver todas.</li><li><b>Ícone de lua:</b> alterna entre tema claro e escuro.</li><li><b>Sair:</b> encerra a sessão. Use sempre em aparelhos de outras pessoas.</li><li><b>Instalar no celular:</b> no menu do navegador, escolha <b>Adicionar à tela inicial</b>. O painel abre como um aplicativo.</li></ul><p class="gn">Se a mensalidade vencer, o acesso fica bloqueado até você regularizar com o administrador.</p>`],
['Conhecendo a tela e o Dashboard',`<p>No topo aparecem o nome da revenda e quantos clientes você tem. O cadastro de clientes é <b>ilimitado</b>. Um número vermelho no menu indica itens novos em <b>Renovações</b> ou <b>Notificações</b>.</p><ul><li><b>Vencimento da mensalidade:</b> quando vence o seu plano com o administrador.</li><li><b>Clientes:</b> total na carteira. <b>Receita mensal:</b> soma dos valores dos clientes.</li><li><b>Vencem em 3 dias / 7 dias:</b> quem vence em breve, com o valor total.</li><li><b>Em atraso:</b> clientes com vencimento passado e o valor devido.</li><li><b>Situação dos clientes e Financeiro:</b> barras com Renovado, Pendente, Prestes a expirar e Devendo; e Recebido, A receber e Atrasado.</li><li><b>Cobrança automática às 09:00:</b> veja o assunto 6 deste guia.</li><li><b>Próximos vencimentos:</b> mostra todos os clientes que vencem <b>hoje, amanhã, em 2 e em 3 dias</b>. Em cada um há o botão <b>Enviar cobrança</b>, que abre o WhatsApp direto com a mensagem pronta, e o botão <b>Renovar</b>. Quem já recebeu a cobrança hoje fica com a etiqueta <b>Enviada hoje</b>.</li></ul>`],
['Cadastrar um cliente',`<ol><li>No menu, toque em <b>Novo cliente</b>.</li><li>Preencha <b>Nome</b> e <b>WhatsApp com DDD</b> (ex.: 81999999999).</li><li>Escolha o número de <b>Telas</b>.</li><li>Em <b>Usuários</b>, digite o usuário do cliente. Use <b>+ Adicionar usuário</b> para incluir mais (até 5).</li><li>Em <b>Aplicativos</b>, toque em um aplicativo de <b>Escolher da lista</b>. Para cadastrar um novo, use <b>Digitar / cadastrar</b>: ele fica salvo na sua lista.</li><li>Informe <b>Situação</b>, <b>Valor (R$)</b> e <b>Vencimento</b>. Marque <b>Já pagou</b> se o mês já está pago.</li><li>Deixe marcado <b>Enviar cobrança ao cadastrar</b> para abrir a mensagem no WhatsApp em seguida.</li><li>Toque em <b>Adicionar</b>.</li></ol><p class="gn">Situação <b>Automática</b> é a recomendada: o painel calcula pelo vencimento. Ao chegar no limite do seu plano, não é possível cadastrar mais clientes.</p>`],
['Meus clientes: buscar, filtrar e entender os status',`<ul><li><b>Pesquisar:</b> nome, WhatsApp, plano ou aplicativo.</li><li><b>Ordenar</b> (nome, vencimento ou data de cadastro) e <b>Mostrar por página</b> mudam a lista.</li><li><b>Filtros coloridos:</b> toque em um bloco para ver só aquele grupo. O número no bloco é a quantidade de clientes. <b>Todos</b> (verde-água), <b>Novo</b> (azul), <b>Grátis</b> (roxo), <b>Renovado</b> (verde), <b>Vence em 3 dias</b> (amarelo) e <b>Não renovado</b> (laranja), que reúne todos os clientes com o plano vencido.</li><li><b>Caixas de seleção:</b> marque clientes para <b>Enviar mensagem</b>, <b>Selecionar todos</b>, <b>Limpar seleção</b> ou <b>Excluir selecionados</b>.</li></ul><p><b>Status:</b> <b>Renovado</b> (em dia), <b>Pendente</b> (vence mais para frente, sem pagamento marcado), <b>Prestes a expirar</b> (vence em até 3 dias) e <b>Devendo</b> (vencimento já passou, com os meses em atraso).</p>`],
['Enviar cobrança, renovar, editar, QR Code e excluir',`<p>No celular, cada cliente aparece em um cartão com os botões embaixo. No computador, os botões ficam na última coluna da linha.</p><ul><li><b>WhatsApp (botão verde):</b> escolha um cupom (opcional), revise o texto e toque em <b>Abrir WhatsApp</b> ou <b>WhatsApp Web</b>. O texto vai pronto, e você toca em enviar.</li><li><b>Renovar:</b> confirme o novo vencimento (padrão +30 dias) e toque em <b>Confirmar renovação</b>. Depois de renovado, o botão vira <b>Desfazer</b>.</li><li><b>Editar:</b> altera os dados do cliente. Toque em <b>Salvar</b>.</li><li><b>QR Code:</b> mostra o QR Code Pix e o copia e cola. <b>Copiar Pix</b> envia o código por mensagem.</li><li><b>Excluir:</b> apaga o cliente após confirmação. Não dá para desfazer; faça backup antes.</li></ul><p class="gn">O WhatsApp não envia sozinho: o painel deixa a conversa pronta e você toca em enviar.</p>`],
['Cobrança automática às 09:00',`<p>O painel prepara a fila de cobranças todo dia às 09:00, mas o <b>WhatsApp exige um toque seu em Enviar</b> para cada mensagem. Nenhum programa consegue enviar sozinho pelo WhatsApp comum.</p><ol><li>No <b>Dashboard</b>, no cartão <b>Cobrança automática às 09:00</b>, marque <b>Ativar</b>.</li><li>Todo dia às 09:00, com o painel aberto (no celular ou no computador), aparece a fila de quem vence <b>hoje ou em até 3 dias</b>.</li><li>Toque em <b>Enviar</b> para abrir o WhatsApp no cliente, envie e volte ao painel para o próximo.</li><li>Para fazer na hora, toque em <b>Enviar agora</b>.</li></ol><p class="gn">Para a fila abrir, cadastre sua chave Pix em Configurações. Quem já recebeu a cobrança no dia não entra de novo. Se o painel estiver fechado às 09:00, a fila aparece na primeira vez que você abrir depois desse horário.</p>`],
['Cobrança em massa',`<ol><li>Em Meus clientes, toque em <b>Cobrança em massa</b>.</li><li>Em <b>Vencem em até</b>, escolha o prazo. Deixe <b>Incluir atrasados</b> marcado para cobrar também quem já venceu.</li><li>Use <b>Marcar todos</b> ou <b>Limpar</b>, ou desmarque quem não quer cobrar agora. <b>Ver prévia da mensagem</b> mostra o texto.</li><li>Toque em <b>Enviar próximo</b>: o WhatsApp abre no próximo cliente com o texto pronto. Envie e volte ao painel para repetir.</li></ol><p>Quem já foi aberto fica marcado como enviado.</p>`],
['Mensagem em massa',`<ol><li>Em Meus clientes, toque em <b>Mensagem em massa</b> (ou <b>Enviar mensagem</b> na barra dos selecionados).</li><li>Filtre por aplicativo e marque os clientes.</li><li>Escreva a mensagem. Use {nome}, {vencimento}, {dias}, {valor}, {usuario}, {telas} e {aplicativo}.</li><li>Se quiser, anexe uma imagem. O WhatsApp não aceita imagem por link: use <b>Copiar imagem</b> e cole na conversa, ou <b>Compartilhar</b> no celular.</li><li>Toque em <b>Enviar</b> ao lado de cada cliente.</li></ol>`],
['Confirmação automática de pagamento (Mercado Pago)',`<p>Com o Mercado Pago conectado, cada cliente recebe um <b>Pix exclusivo</b> na mensagem. Quando ele paga, o painel confirma e <b>renova o plano sozinho (+30 dias)</b>. O dinheiro cai direto na sua conta do Mercado Pago.</p><ol><li>Tenha uma conta no <b>mercadopago.com.br</b> com uma chave Pix cadastrada.</li><li>Entre em <b>mercadopago.com.br/developers</b> > <b>Suas integrações</b> > <b>Criar aplicação</b> (escolha Checkout Transparente).</li><li>Abra <b>Credenciais de produção</b> e copie o <b>Access Token</b>, que começa com <b>APP_USR-</b>. Não use o token de teste.</li><li>No painel, abra <b>Configurações</b> > <b>Confirmação automática de pagamento</b>, cole o token e toque em <b>Conectar Mercado Pago</b>.</li></ol><ul><li><b>Verificar pagamentos agora:</b> confere na hora se algum Pix foi pago. O painel também confere sozinho a cada 30 segundos, enquanto está aberto.</li><li><b>Desconectar:</b> as mensagens voltam a usar a sua chave Pix fixa, sem confirmação automática.</li><li>Cada Pix vale 7 dias. Se o valor ou o vencimento do cliente mudar, o painel gera um Pix novo.</li><li>Com cupom de desconto, a mensagem usa a chave Pix fixa, e aí a confirmação é manual.</li></ul><p class="gn">A confirmação só vale para o <b>Pix exclusivo</b> da mensagem. Se o cliente pagar na chave fixa, use <b>Renovar</b> à mão. O Mercado Pago cobra as taxas dele sobre cada recebimento. Se a função não aparecer em Configurações, o administrador ainda não ativou.</p>`],
['Não renovado e Renovações',`<p>A aba <b>Não renovado</b> lista os clientes com o plano vencido. Toque em <b>Enviar promoção</b> (um cliente) ou em <b>Enviar promoção para todos</b>: escolha um cupom de desconto, edite a mensagem e anexe uma imagem de promoção. Abaixo ficam os <b>pedidos de renovação</b> feitos pelos clientes. Quando receber o pagamento, toque em <b>Confirmar pagamento</b>: o vencimento do cliente avança e ele passa a renovado. Para não aceitar, toque em <b>Recusar</b>.</p>`],
['Notificações do administrador',`<p>Os avisos do administrador chegam na aba <b>Notificações</b>, com um número vermelho no menu. Aparecem como <b>Não lida</b>. Toque na notificação para abrir o texto: ela passa a <b>Lida</b> e o administrador vê que você leu.</p>`],
['Configurações: logo, senha, backup, Pix, mensagem e cupons',`<ul><li><b>Logo da revenda:</b> toque em <b>Adicionar logo</b> e escolha a imagem.</li><li><b>Alterar minha senha:</b> digite a senha atual, a nova senha (mínimo 6 caracteres) duas vezes e toque em <b>Salvar nova senha</b>.</li><li><b>Confirmação automática de pagamento:</b> conecte o Mercado Pago (assunto 9).</li><li><b>Backup:</b> <b>Baixar backup</b> salva todos os clientes em um arquivo. <b>Adicionar arquivo</b> restaura: escolha <b>Mesclar</b> (não apaga nada) ou <b>Substituir tudo</b>. Se o arquivo não abrir, cole o conteúdo em <b>Restaurar do texto</b>.</li><li><b>Pix:</b> escolha o tipo da chave, digite chave, nome do recebedor e cidade e toque em <b>Salvar</b>. Isso gera o QR Code e o copia e cola.</li><li><b>Mensagem de cobrança:</b> edite o texto padrão e toque em <b>Salvar mensagem</b>. Variáveis: {nome} {valor} {plano} {telas} {dias} {usuario} {operador} {aplicativo} {vencimento} {situacao} {chave} {pix} {cupom} {total}.</li><li><b>Cupons:</b> três cupons editáveis (R$ 5, R$ 10 e R$ 15). Altere o código, marque <b>Ativo</b> e toque em <b>Salvar cupons</b>.</li></ul>`],
['Clientes ilimitados e mensalidade',`<p>Você pode cadastrar <b>quantos clientes quiser</b>, sem limite. A data da sua mensalidade aparece no Dashboard.</p>`],
['Dúvidas frequentes',`<ul><li><b>Não aparece o QR Code nem o Pix na mensagem:</b> cadastre a chave Pix em Configurações.</li><li><b>O banco diz que o Pix copia e cola é inválido:</b> gere uma cobrança nova (mensagens antigas podem ter o código antigo) e confira tipo da chave, nome e cidade em Configurações > Pix.</li><li><b>Apareceu "Pix automático indisponível":</b> o painel enviou com a sua chave fixa. Confira se o Mercado Pago está conectado e se o token é o de produção (APP_USR-). Se continuar, avise o administrador.</li><li><b>O cliente pagou e o plano não renovou:</b> toque em <b>Verificar pagamentos agora</b> em Configurações. Se ele pagou na chave fixa, use <b>Renovar</b> no cliente.</li><li><b>Não consigo cadastrar mais clientes:</b> você chegou ao limite do plano.</li><li><b>Excluí um cliente sem querer:</b> restaure o último backup escolhendo <b>Mesclar</b>. Baixe backups com frequência.</li><li><b>A fila das 09:00 não abriu:</b> ela só abre com o painel aberto e a opção <b>Ativar</b> marcada no Dashboard.</li><li><b>Troquei de celular:</b> os dados ficam na nuvem. Entre com o mesmo usuário e senha.</li></ul>`]];
const gOpen=new Set();
const gTog=(i,o)=>{o?gOpen.add(i):gOpen.delete(i)};
function guideRes(){return `<style>.gd details{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--card)}.gd summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}.gd summary::after{content:"+";color:var(--mut)}.gd details[open] summary::after{content:"−"}.gd summary::-webkit-details-marker{display:none}.gd .gb{padding:0 14px 12px;font-size:14px;line-height:1.55}.gd ol,.gd ul{margin:6px 0 8px;padding-left:20px}.gd li{margin-bottom:5px}.gd p{margin:6px 0}.gd .gn{background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:13px}</style><div class="card gd"><h2>Guia da revenda</h2><p class="note" style="margin:0 0 12px">Passo a passo de todas as funções do painel. Toque em um assunto para abrir.</p>${GUIDE.map((g,i)=>`<details ${gOpen.has(i)?'open':''} ontoggle="gTog(${i},this.open)"><summary>${i+1}. ${g[0]}</summary><div class="gb">${g[1]}</div></details>`).join('')}</div>`}
function addReseller(e){e.preventDefault();const f=e.target;
 const user=f.user.value.trim();
 if(user===db.master.user||db.resellers.some(r=>r.user===user)){toast('Esse usuário já existe.');return}
 if(FBMODE&&!fbPwOk(user,f.pass.value)){toast(FB_PW_MSG);return}
 const nid=uid(),sendAcc=f.sendacc.checked;db.resellers.push({id:nid,name:f.name.value.trim(),user,pass:f.pass.value,phone:f.phone.value.trim(),unlimited:f.unl.checked,fee:f.unl.checked?null:+f.fee.value,due:f.unl.checked?'':f.due.value,paid:false,active:true,created:today()});
 save();render();if(sendAcc)waAcesso(nid)}
function toggleRes(id){const r=db.resellers.find(r=>r.id===id);r.active=!r.active;save();render()}
function delRes(id){ask('Excluir revenda e todos os clientes dela?',0,()=>{if(FBMODE){fbDelRes(id);return}db.resellers=db.resellers.filter(r=>r.id!==id);db.clients=db.clients.filter(c=>c.rid!==id);save();render()})}
function resetPass(id){ask('Nova senha da revenda:',1,async p=>{if(!p)return;const r=db.resellers.find(r=>r.id===id);
 if(FBMODE){if(!fbPwOk(r.user,p)){toast(FB_PW_MSG);return}try{await fbChg(r,null,p)}catch(x){toast('Não foi possível trocar a senha ('+(x.code||x.message)+').');return}}
 r.pass=p;save();render();toast('Senha alterada.')})}
function changeMasterEmail(){$('#modal').innerHTML=`<div class="ov"><div class="md" style="text-align:left;max-width:380px"><h2>E-mail de acesso</h2><p class="note" style="margin:0 0 10px">Seu usuário atual: <b>${esc(db.master.user||'')}</b>. Troque por um e-mail seu: ele passa a ser o usuário e permite recuperar a senha em <b>Esqueci minha senha</b>.</p><input id="mailv" type="email" placeholder="seuemail@exemplo.com" autocapitalize="none" autocorrect="off" spellcheck="false"><div style="display:flex;gap:8px;margin-top:12px"><button id="mailok">Salvar</button><button class="s" onclick="closeM()">Cancelar</button></div></div></div>`;
 $('#mailok').onclick=async()=>{const m=$('#mailv').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast('Informe um e-mail válido.');return}
  try{await itCall('update',{idToken:await tok(),email:m,returnSecureToken:false});closeM();db.master.user=m;save();render();toast('Pronto! Seu usuário agora é '+m+'.')}
  catch(x){toast(x.code==='EMAIL_EXISTS'?'Esse e-mail já está em uso.':x.code==='CREDENTIAL_TOO_OLD_LOGIN_AGAIN'||x.code==='INVALID_ID_TOKEN'?'Por segurança, saia, entre de novo e repita.':'Não foi possível salvar ('+(x.code||x.message)+').')}}}
function changeMaster(){ask('Nova senha do usuário master:',1,async p=>{if(!p)return;
 if(FBMODE){if(p.length<6){toast('A senha precisa ter pelo menos 6 caracteres.');return}try{await itCall('update',{idToken:await tok(),password:p,returnSecureToken:false});toast('Senha alterada.')}catch(x){toast(x.code==='CREDENTIAL_TOO_OLD_LOGIN_AGAIN'?'Por segurança, saia, entre de novo e repita a troca.':'Não foi possível trocar a senha ('+(x.code||x.message)+').')}return}
 db.master.pass=p;save();toast('Senha alterada.')})}

function addClient(e){e.preventDefault();const f=e.target;
 if(f.phone.value.replace(/\D/g,'').length<10){toast('Informe o WhatsApp com DDD.');return}
 const nid=uid(),snd=f.send.checked;db.clients.push({id:nid,rid:ses.id,name:f.name.value.trim(),phone:f.phone.value.trim(),screens:+f.tela.value,plan:telaTxt(+f.tela.value),users:usersOf(f),user:usersOf(f).join(", "),apps:appsOf(f),app:appsOf(f).join(", "),value:+f.value.value,due:f.due.value,paid:f.paid.checked,created:today(),sit:sitVal(f)});
 save();render();if(snd)wa(nid)}
function renewCli(id){const c=db.clients.find(c=>c.id===id);let n=nextDue(c);
 $('#modal').innerHTML=`<div class="ov"><div class="md" style="text-align:left"><h2>Renovar ${esc(c.name)}</h2><form id="rf" style="grid-template-columns:1fr"><div><label>Novo vencimento (padrão: mesmo dia do próximo mês)</label><input name="d" type="date" value="${n}" required></div><div style="display:flex;gap:8px"><button>Confirmar renovação</button><button type="button" class="s" onclick="closeM()">Cancelar</button></div></form></div></div>`;
 $('#rf').onsubmit=e=>{e.preventDefault();c.prevDue=c.due;c.prevPaid=!!c.paid;setDue(c,e.target.d.value);c.paid=true;save();closeM();render();toast('Plano renovado. Abrindo a confirmação no WhatsApp…');confPay(id)}}
function editCli(id){const c=db.clients.find(c=>c.id===id);
 $('#modal').innerHTML=`<div class="ov"><div class="md" style="text-align:left"><h2>Editar cliente</h2><form id="cf" style="grid-template-columns:1fr" oninput="fSync(event,this)" onchange="fSync(event,this)"><div><label>Nome</label><input name="name" value="${esc(c.name)}" required></div><div><label>WhatsApp</label><input name="phone" value="${esc(c.phone)}"></div>${telaSel(c)}${usersBlock(usersList(c))}${appsBlock(appsList(c))}${sitSel(c)}<div><label>Valor (R$)</label><input name="value" type="number" step="0.01" min="0" value="${c.value}" required></div><div><label>Vencimento</label><input name="due" type="date" value="${c.due}" required></div>${stField(c.due,c.paid)}<div style="display:flex;gap:8px"><button>Salvar</button><button type="button" class="s" onclick="closeM()">Cancelar</button></div></form></div></div>`;
 $('#cf').onsubmit=e=>{e.preventDefault();const f=e.target;c.name=f.name.value.trim();c.phone=f.phone.value.trim();if(f.tela.value){c.screens=+f.tela.value;c.plan=telaTxt(c.screens)}c.users=usersOf(f);c.user=c.users.join(", ");c.apps=appsOf(f);c.app=c.apps.join(", ");c.value=+f.value.value;c.due=f.due.value;c.paid=f.paid.checked;c.sit=sitVal(f);save();closeM();render();toast('Cliente atualizado.')}}
function undoCli(id){const c=db.clients.find(c=>c.id===id);if(c.prevDue)c.due=c.prevDue;c.paid=!!c.prevPaid;save();render()}
function delCli(id){ask('Excluir cliente?',0,()=>{db.clients=db.clients.filter(c=>c.id!==id);db.renewals=db.renewals.filter(r=>r.cid!==id);save();render()})}
function qrBlob(code){return new Promise((ok,no)=>{const sv=qrSvg(code).replace('width="240" height="240"','width="640" height="640"'),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=640;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,640,640);x.drawImage(im,0,0,640,640);c.toBlob(b=>b?ok(b):no(),'image/png')};im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sv)})}
async function dlQR(code){try{const b=await qrBlob(code),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='qrcode-pix.png';document.body.appendChild(a);a.click();a.remove();toast('Imagem do QR Code baixada.')}catch(e){toast('Não foi possível baixar. Use Copiar imagem ou tire um print do QR.')}}
async function copyQR2(code){try{const b=await qrBlob(code);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Imagem copiada. Cole na conversa do WhatsApp.')}catch(e){toast('Não foi possível copiar a imagem. Use Baixar imagem.')}}

const clean=(t,n)=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().slice(0,n)||'NA';
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixType(px){if(px.type)return px.type;const k=px.key.trim();if(k.includes('@'))return'email';if(/^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$/i.test(k))return'evp';if(k.startsWith('+')||/[() ]/.test(k))return'cel';return'cpf'}
function pixKey(px){const k=px.key.trim(),t=pixType(px),dg=k.replace(/\D/g,'');
 if(t==='email'||t==='evp')return k.toLowerCase();
 if(t==='cel')return '+'+((dg.length<=11)?'55'+dg:dg);
 return dg}
function pixPayload(px,value,txid){txid=String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25);if(txid.length<4)txid='PAINEL';
 const body=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',pixKey(px)))+tlv('52','0000')+tlv('53','986')+(value>0?tlv('54',value.toFixed(2)):'')+tlv('58','BR')+tlv('59',clean(px.name,25))+tlv('60',clean(px.city,15))+tlv('62',tlv('05',txid))+'6304';
 return body+crc16(body)}
